<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Task</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
<body class="bg-warning-subtle m-0">
  <header>
    <p class="m-2 mb-0 text-center"><u>Bootstrap task via CDN</u></p>
  </header>
  <br />
  <main>
    <!-- Navbar row -->
    <div class="row g-3 border border-black border-2 rounded align-items-center m-2 mt-0 p-3">
      
      <!-- Logo -->
      <div class="col-12 col-md-4 text-center text-md-start">
        <p class="h5 m-0">task logo</p>
      </div>

      <!-- Menu items -->
      <div class="col-12 col-md-8">
        <div class="row text-center text-md-start">
          <div class="col-12 col-md-4">Column 1</div>
          <div class="col-12 col-md-4">Column 2</div>
          <div class="col-12 col-md-4">Column 3</div>
        </div>
      </div>
    </div>

    <!-- Cards and button row -->
    <div class="row g-3 p-3 text-center text-md-start">
      <div class="col-12 col-md-4">
        <div class="card h-100">
          <div class="card-header">Featured</div>
          <div class="card-body">
            <h5 class="card-title">Special title treatment</h5>
            <p class="card-text">
              With supporting text below as a natural lead-in to additional content.
            </p>
            <a href="#" class="btn btn-primary">Go somewhere</a>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-4">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Card title</h5>
            <p class="card-text">
              With supporting text below as a natural lead-in to additional content.
            </p>
            <a href="#" class="btn btn-primary">Button</a>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-4 d-flex align-items-center justify-content-center justify-content-md-start">
        <button type="button" class="btn btn-primary btn-lg w-100 w-md-auto">
          Large button
        </button>
      </div>
    </div>
  </main>
</body>


</html>
